        - {material: GUNPOWDER, min: 1, max: 3, weight: 6}
        - {material: FLINT, min: 1, max: 3, weight: 6, name: "§7Кремень"}
        - {material: STRING, min: 2, max: 5, weight: 5}
        - {material: ARROW, min: 5, max: 10, weight: 6}
        - {material: PAPER, min: 3, max: 8, weight: 6, name: "§7Кассовый жетон"}
        - {material: SLIME_BALL, min: 1, max: 2, weight: 4, name: "§7Странный сгусток"}
    3:
