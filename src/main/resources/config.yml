# BricklyExpedition - Stage A configuration
# Every value here is a starting point from the concept doc, not a final
# balance pass - tune freely, nothing here requires a recompile.

zones:
  count: 8

raid:
  # 30 min session, last 2 of which are the "apocalypse" phase.
  active-duration-seconds: 1680        # 28 min
  apocalypse-duration-seconds: 120     # 2 min
  # Evac hatch channel times (paid = faster) - see the #evac markers.
  prep-duration-paid-seconds: 30
  prep-duration-free-seconds: 90
  evac-key-price: 1500

  # Stage C entry flow: "встаешь в очередь" - lobby-wait-seconds is how long
  # the queue stays open collecting players once the first one joins (a
  # countdown broadcast to everyone waiting); prep-countdown-seconds is the
  # short final "приготовьтесь" window right before teleporting everyone in.
  lobby-wait-seconds: 45
  prep-countdown-seconds: 10

  # Where a player lands after evacuating (or if their raid is force-ended).
  # World name blank -> falls back to the first loaded world's spawn point
  # (logged once as a warning) - set this once BricklyWorld's hub is known.
  hub:
    world: ""
    x: 0.0
    y: 100.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

anti-extraction:
  # Any block at or below (zone floor Y + this offset) cannot be broken at
  # all - no event, no drop, no journal entry (and, since 2026-09-06, the
  # same rule also blocks any explosion from digging through the floor -
  # see BlockChangeListener#onEntityExplode). Keep at 0 unless a zone's
  # floor needs a buffer.
  ground-floor-y-offset: 0

  # Material -> custom drop remap. Breaking the key on the left drops the
  # material on the right instead of its real vanilla drop, so nothing of
  # ordinary economic value leaves an expedition. Anything NOT listed here
  # drops normally (vanilla loot untouched, this table is scoped to blocks
  # deliberately worth guarding, e.g. this world's ore/valuable blocks).
  block-remap:
    COPPER_BLOCK: OAK_PLANKS
    IRON_BLOCK: OAK_PLANKS
    GOLD_BLOCK: OAK_PLANKS
    DIAMOND_BLOCK: OAK_PLANKS
    EMERALD_BLOCK: OAK_PLANKS
    NETHERITE_BLOCK: OAK_PLANKS
    LAPIS_BLOCK: OAK_PLANKS
    REDSTONE_BLOCK: OAK_PLANKS

# Stage G - the post-raid "sell what you looted" screen. default-price is
# used for any material not explicitly listed here (deliberately low -
# "режь доходность сильно" - keep it a nice bonus, not economy-breaking).
# These are placeholder values, same as the loot tiers below - a real pass
# needs actual playtesting data, but every number here was chosen with an
# eye on evac-key-price (1500) as the economy's real anchor: nothing in
# this list is meant to make that price trivial to afford from one lucky
# tier-10 pull alone.
economy:
  default-sell-price: 2
  sell-prices:
    IRON_INGOT: 8
    GOLD_INGOT: 15
    DIAMOND: 40
    EMERALD: 25
    NETHERITE_SCRAP: 90
    NETHERITE_INGOT: 220
    NETHER_STAR: 500
    TOTEM_OF_UNDYING: 350
    ENCHANTED_GOLDEN_APPLE: 300
    ENCHANTED_BOOK: 120
    EXPERIENCE_BOTTLE: 5
    DIAMOND_BLOCK: 340
    EMERALD_BLOCK: 220
    NETHERITE_BLOCK: 1900
    GUNPOWDER: 1
    LEATHER: 1
    # 2026-09-06 additions for the expanded loot pack below - modest,
    # ordinary vanilla-adjacent values, nothing here approaches evac-key-price.
    STICK: 1
    BONE: 1
    ROTTEN_FLESH: 1
    GRAVEL: 1
    GLASS_BOTTLE: 1
    SLIME_BALL: 2
    FLINT: 2
    GOLD_NUGGET: 2
    IRON_NUGGET: 2
    COMPASS: 5
    SPYGLASS: 10
    FISHING_ROD: 6
    LEATHER_CHESTPLATE: 5
    IRON_CHESTPLATE: 25
    DIAMOND_CHESTPLATE: 90
    SPECTRAL_ARROW: 1
    SHULKER_SHELL: 60
    ECHO_SHARD: 30
    RECOVERY_COMPASS: 20
    GHAST_TEAR: 20
    BEACON: 150
    IRON_SWORD: 10
    DIAMOND_SWORD: 60
    BOW: 12
    TIPPED_ARROW: 2
    SHIELD: 8
    SADDLE: 15
    GOLDEN_APPLE: 20
  # Name-specific overrides (exact display name match, colour codes and all)
  # - lets a unique named artifact/legend be worth more than an ordinary
  # unnamed copy of the same base material, without inflating that
  # material's price everywhere else it's used. Kept well below
  # evac-key-price (1500) and NETHERITE_BLOCK's 1900 on purpose - these are
  # meant to feel special, not to trivialise the economy.
  sell-prices-by-name:
    '§5Артефакт: Реликвия': 650
    '§5Артефакт: Ядро реактора': 380
    '§6Легенда: Чип управления': 260
    '§6Легенда: Слеза мира': 200
    '§9Раритет: Маяк последней позиции': 110
    '§9Раритет: Позывной маяк': 90
    '§aРаритет: Оптика наблюдателя': 45
    '§9Раритет: Схема тайника': 25
    '§aТрофей: светящиеся стрелы': 3

# Stage E - loot cache tiers. An admin places a chest/barrel at a LOOT_CACHE
# marker and tags it with a tier id 1-10 (in the zone editor GUI); this is
# what fills it every time the raid goes ACTIVE. open-seconds is how long a
# player must channel next to the cache before it unlocks (design ask:
# "чем круче лут тем дольше открывается"). Item pools below use vanilla
# materials as placeholders for the concept doc's custom artifacts/treasure
# items - a real named-item/enchant economy is a later pass once there's a
# resource pack and custom item ids to hang it on; weight is relative, not
# a percentage, and only matters relative to other entries in the same tier.
#
# CONTENT UPGRADE (2026-09-06, real request - "огромный гигантский пак
# кастомного лута... от хуйни до легендарного, но не убивать экономику"):
# every tier's pool below was expanded well past the original 3-4 entries,
# and a recurring cast of named "artifact"/"legend"/"rarity" items (with
# flavor lore) was added across tiers 3-10 so a rare pull actually reads as
# a find, not just a bigger number - see economy.sell-prices-by-name above
# for how these are priced independently of their base material.
loot:
  tiers:
    1:
      open-seconds: 4
      items:
        - {material: PAPER, min: 2, max: 5, weight: 10, name: "§7Кассовый жетон", lore: ["§8Мятая расписка без реальной ценности."]}
        - {material: STRING, min: 1, max: 4, weight: 10}
        - {material: ARROW, min: 4, max: 12, weight: 9}
        - {material: COAL, min: 1, max: 3, weight: 7}
        - {material: ROTTEN_FLESH, min: 1, max: 3, weight: 8, name: "§7Протухший паёк"}
