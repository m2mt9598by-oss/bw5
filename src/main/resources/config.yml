        - {material: STICK, min: 2, max: 5, weight: 8, name: "§7Обломок арматуры"}
        - {material: IRON_NUGGET, min: 2, max: 4, weight: 6}
        - {material: GLASS_BOTTLE, min: 1, max: 2, weight: 5, name: "§7Пустая фляга"}
        - {material: BONE, min: 1, max: 3, weight: 6}
    2:
